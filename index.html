<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Darkness of Life</title>
  <style>
    /* Dark background, centred content, electric blue accent */
    body {
      margin: 0;
      background: #05070d;
      color: #e8ecf4;
      font-family: sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin-top: 60px;
      font-size: 48px;
      color: #00bfff;
    }
    p { color: #9aa7bd; }
    button {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 20px;
      background: #00bfff;
      color: #05070d;
      border: none;
      cursor: pointer;
    }
    /* Full-screen title video, whole frame visible, nothing clipped */
    #titleVideo, #titleEndVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #05070d;
      z-index: 0;
    }
    /* The end scene starts hidden and crossfades in over the title */
    #titleEndVideo {
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #titleEndVideo.show { opacity: 1; }
    /* Electric power breathing over the resting end scene */
    #powerPulse {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #powerPulse.show { opacity: 1; }
    #powerPulse .pulse-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(0, 191, 255, 0.20) 0%, rgba(0, 191, 255, 0.06) 45%, transparent 70%);
      animation: power-breathe 3s ease-in-out infinite;
    }
    @keyframes power-breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    h1, p, button {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    button { text-shadow: none; }
    /* The video has its own title and PRESS START baked in,
       so the page's own title text stays hidden */
    h1, .tagline { display: none; }
    /* Fade the title out when the screen is tapped */
    body > * { transition: opacity 1s ease; }
    body.fading > *:not(#loading) { opacity: 0; }
    /* Loading screen: X-RX runs along the city streets, CoM style */
    #loading {
      position: fixed;
      inset: 0;
      background: url('assets/loading-cityscape.jpg') center bottom / cover no-repeat #05070d;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
    }
    #loading.show { opacity: 1; pointer-events: auto; }
    #loading .runner {
      position: absolute;
      bottom: 18%;
      left: 0;
      width: 100px;
      height: 200px;
      background-image: url('assets/x-rx-run-sheet.png');
      background-size: 600px 200px;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      animation: run-cycle 0.7s steps(6) infinite,
                 run-across 5s linear infinite;
    }
    @keyframes run-cycle {
      from { background-position: 0 0; }
      to { background-position: -600px 0; }
    }
    @keyframes run-across {
      from { left: -12%; }
      to { left: 105%; }
    }
    #loading .loading-text {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      color: #00bfff;
      font-size: 22px;
      letter-spacing: 4px;
      margin: 0;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    /* Enter prompt: blurs the entire screen until the user answers */
    #enterPrompt {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 13, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    #enterPrompt.hidden { display: none; }
    #enterPrompt .prompt-card {
      background: #0a0f1c;
      border: 1px solid #00bfff;
      box-shadow: 0 0 40px rgba(0, 191, 255, 0.35);
      padding: 28px 32px;
      max-width: 340px;
      text-align: center;
    }
    #enterPrompt .prompt-card p {
      color: #e8ecf4;
      font-size: 20px;
      margin: 0 0 22px;
    }
    #enterPrompt .prompt-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    #enterPrompt .prompt-buttons button {
      margin-top: 0;
      padding: 12px 32px;
      font-size: 18px;
      cursor: pointer;
      border: 1px solid #00bfff;
    }
    #enterPrompt .prompt-yes {
      background: #00bfff;
      color: #05070d;
    }
    #enterPrompt .prompt-no {
      background: transparent;
      color: #00bfff;
    }
  </style>
</head>
<body>
  <h1>THE DARKNESS OF LIFE</h1>
  <video id="titleVideo" src="assets/title-screen.mp4" poster="assets/title-screen-poster.jpg" autoplay muted playsinline></video>
  <video id="titleEndVideo" src="assets/title-screen-end.mp4" poster="assets/title-screen-end.png" muted playsinline preload="auto"></video>
  <div id="powerPulse"><div class="pulse-glow"></div></div>
  <audio id="titleMusic" src="assets/title-music.mp3" loop preload="auto"></audio>
  <p class="tagline"><em>"We walk the dark, rise. We walk with truth and honor. We tend and earn our place."</em></p>
  <p class="tagline">A Chain of Memories-inspired card battler, made our own.</p>
  <p id="message"></p>

  <!-- Loading screen: X-RX runs along the city streets -->
  <div id="loading">
    <div class="runner"></div>
    <p class="loading-text">Loading...</p>
  </div>

  <!-- Enter prompt: blurs the whole screen; answering it is the
       click that lets the music play -->
  <div id="enterPrompt">
    <div class="prompt-card">
      <p>Are you ready to enter the Dissonance?</p>
      <div class="prompt-buttons">
        <button id="enterYes" class="prompt-yes" type="button">YES</button>
        <button id="enterNo" class="prompt-no" type="button">NO</button>
      </div>
    </div>
  </div>

  <script>
    // Title music: "Gason Van Yan's Coffin" — it starts only once
    // the user answers the enter prompt, because that click is
    // the gesture browsers need before sound can play
    const titleMusic = document.getElementById('titleMusic');
    titleMusic.volume = 0.8;

    // Title loop: the intro video plays, crossfades into the end
    // scene — the diminished hovering over the city, X-RX holding
    // his sword with his cello on his back, static with power —
    // and when the end scene finishes, it fades back to the
    // beginning video and the whole loop runs again.
    const titleVideo = document.getElementById('titleVideo');
    const endVideo = document.getElementById('titleEndVideo');
    const powerPulse = document.getElementById('powerPulse');
    let showing = 'title'; // 'title' or 'end'
    function showEnd() {
      if (started || showing === 'end') return;
      showing = 'end';
      endVideo.currentTime = 0;
      endVideo.play();
      endVideo.classList.add('show');
      powerPulse.classList.add('show');
      setTimeout(() => titleVideo.pause(), 1600);
    }
    function showTitle() {
      if (started || showing === 'title') return;
      showing = 'title';
      titleVideo.currentTime = 0;
      titleVideo.play();
      endVideo.classList.remove('show');
      powerPulse.classList.remove('show');
      setTimeout(() => endVideo.pause(), 1600);
    }
    titleVideo.addEventListener('timeupdate', () => {
      if (!titleVideo.duration) return;
      if (titleVideo.currentTime >= titleVideo.duration - 1.5) showEnd();
    });
    endVideo.addEventListener('ended', showTitle);

    // Enter prompt: blurs the whole screen until the user answers.
    // Either answer clears the prompt and restarts the title
    // video from the beginning; YES also starts the music.
    const enterPrompt = document.getElementById('enterPrompt');
    let promptDismissed = false;
    function dismissPrompt(withMusic) {
      if (promptDismissed) return;
      promptDismissed = true;
      enterPrompt.classList.add('hidden');
      // Restart the title loop from the beginning
      showing = 'title';
      endVideo.classList.remove('show');
      powerPulse.classList.remove('show');
      endVideo.pause();
      titleVideo.currentTime = 0;
      titleVideo.play();
      if (withMusic) titleMusic.play().catch(() => {});
    }
    document.getElementById('enterYes').addEventListener('click', (e) => {
      e.stopPropagation();
      dismissPrompt(true);
    });
    document.getElementById('enterNo').addEventListener('click', (e) => {
      e.stopPropagation();
      dismissPrompt(false);
    });
    // Clicks on the prompt itself must not start the game
    enterPrompt.addEventListener('click', (e) => e.stopPropagation());

    // When anywhere on the screen is tapped, fade out the title,
    // show the loading screen for ~5 seconds, then go to
    // character creation
    let started = false;
    function startGame() {
      if (started || !promptDismissed) return;
      started = true;
      document.body.classList.add('fading');
      const loading = document.getElementById('loading');
      setTimeout(() => loading.classList.add('show'), 1000);
      setTimeout(() => { window.location.href = 'character.html'; }, 6000);
    }
    document.addEventListener('click', startGame);
  </script>
</body>
</html>
