<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Darkness of Life</title>
  <style>
    /* Dark background, centred content, electric blue accent */
    body {
      margin: 0;
      background: #05070d;
      color: #e8ecf4;
      font-family: sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin-top: 60px;
      font-size: 48px;
      color: #00bfff;
    }
    p { color: #9aa7bd; }
    button {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 20px;
      background: #00bfff;
      color: #05070d;
      border: none;
      cursor: pointer;
    }
    /* Full-screen moving title screen, content overlaid on top */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
    }
    h1, p, button {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    button { text-shadow: none; }
  </style>
</head>
<body>
  <h1>THE DARKNESS OF LIFE</h1>
  <video src="assets/title-screen.mp4" poster="assets/title-screen-art.png" autoplay muted loop playsinline></video>
  <p><em>"We walk the dark, rise. We walk with truth and honor. We tend and earn our place."</em></p>
  <p>A Chain of Memories-inspired card battler, made our own.</p>
  <button id="startBtn">START</button>
  <p id="message"></p>

  <script>
    // When Start is pressed, go to the first level
    document.getElementById('startBtn').addEventListener('click', () => {
      window.location.href = 'character.html';
    });
  </script>
</body>
</html>
