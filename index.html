<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Darkness of Life</title>
  <style>
    /* Dark background, centred content, electric blue accent */
    body {
      margin: 0;
      background: #05070d;
      color: #e8ecf4;
      font-family: sans-serif;
      text-align: center;
    }
    h1 {
      margin-top: 60px;
      font-size: 48px;
      color: #00bfff;
    }
    p { color: #9aa7bd; }
    button {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 20px;
      background: #00bfff;
      color: #05070d;
      border: none;
      cursor: pointer;
    }
    video {
      width: 100%;
      max-width: 900px;
      display: block;
      margin: 20px auto 0;
    }
  </style>
</head>
<body>
  <h1>THE DARKNESS OF LIFE</h1>
  <video src="assets/title-screen.mp4" poster="assets/title-screen-art.png" autoplay muted loop playsinline></video>
  <p><em>"We walk the dark, rise. We walk with truth and honor. We tend and earn our place."</em></p>
  <p>A Chain of Memories-inspired card battler, made our own.</p>
  <button id="startBtn">START</button>
  <p id="message"></p>

  <script>
    // When Start is pressed, go to the first level
    document.getElementById('startBtn').addEventListener('click', () => {
      window.location.href = 'character.html';
    });
  </script>
</body>
</html>
