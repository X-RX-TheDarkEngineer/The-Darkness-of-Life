<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Darkness of Life</title>
  <style>
    /* Dark background, centred content, electric blue accent */
    body {
      margin: 0;
      background: #05070d;
      color: #e8ecf4;
      font-family: sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin-top: 60px;
      font-size: 48px;
      color: #00bfff;
    }
    p { color: #9aa7bd; }
    button {
      margin-top: 30px;
      padding: 14px 40px;
      font-size: 20px;
      background: #00bfff;
      color: #05070d;
      border: none;
      cursor: pointer;
    }
    /* Full-screen title video, whole frame visible, nothing clipped */
    #titleVideo, #titleEndVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #05070d;
      z-index: 0;
    }
    /* The end scene starts hidden and crossfades in over the title */
    #titleEndVideo {
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #titleEndVideo.show { opacity: 1; }
    /* Electric power breathing over the resting end scene */
    #powerPulse {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #powerPulse.show { opacity: 1; }
    #powerPulse .pulse-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(0, 191, 255, 0.20) 0%, rgba(0, 191, 255, 0.06) 45%, transparent 70%);
      animation: power-breathe 3s ease-in-out infinite;
    }
    @keyframes power-breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    h1, p, button {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
    button { text-shadow: none; }
    /* The video has its own title and PRESS START baked in,
       so the page's own title text stays hidden */
    h1, .tagline { display: none; }
    /* Fade the title out when the screen is tapped */
    body > * { transition: opacity 1s ease; }
    body.fading > *:not(#loading) { opacity: 0; }
    /* Loading screen: X-RX runs along the city streets, CoM style */
    #loading {
      position: fixed;
      inset: 0;
      background: url('assets/loading-cityscape.jpg') center bottom / cover no-repeat #05070d;
      z-index: 3;
      opacity: 0;
      pointer-events: none;
    }
    #loading.show { opacity: 1; pointer-events: auto; }
    #loading .runner {
      position: absolute;
      bottom: 18%;
      left: 0;
      width: 100px;
      height: 200px;
      background-image: url('assets/x-rx-run-sheet.png');
      background-size: 600px 200px;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      animation: run-cycle 0.7s steps(6) infinite,
                 run-across 5s linear infinite;
    }
    @keyframes run-cycle {
      from { background-position: 0 0; }
      to { background-position: -600px 0; }
    }
    @keyframes run-across {
      from { left: -12%; }
      to { left: 105%; }
    }
    #loading .loading-text {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      color: #00bfff;
      font-size: 22px;
      letter-spacing: 4px;
      margin: 0;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <h1>THE DARKNESS OF LIFE</h1>
  <video id="titleVideo" src="assets/title-screen.mp4" poster="assets/title-screen-poster.jpg" autoplay muted playsinline></video>
  <video id="titleEndVideo" src="assets/title-screen-end.mp4" poster="assets/title-screen-end.png" muted playsinline preload="auto"></video>
  <div id="powerPulse"><div class="pulse-glow"></div></div>
  <audio id="titleMusic" src="assets/title-music.mp3" loop preload="auto" autoplay></audio>
  <p class="tagline"><em>"We walk the dark, rise. We walk with truth and honor. We tend and earn our place."</em></p>
  <p class="tagline">A Chain of Memories-inspired card battler, made our own.</p>
  <p id="message"></p>

  <!-- Loading screen: X-RX runs along the city streets -->
  <div id="loading">
    <div class="runner"></div>
    <p class="loading-text">Loading...</p>
  </div>

  <script>
    // Title music: "Gason Van Yan's Coffin" — it tries to start the
    // moment the page opens; browsers block sound until the first
    // tap on a first visit, so it also starts on the first tap
    // anywhere, and on later visits it can autoplay outright
    const titleMusic = document.getElementById('titleMusic');
    titleMusic.volume = 0.8;
    titleMusic.play().catch(() => {});
    document.addEventListener('pointerdown', () => {
      titleMusic.play().catch(() => {});
    }, { once: true });

    // Title loop: the intro video plays, crossfades into the end
    // scene — the diminished hovering over the city, X-RX holding
    // his sword with his cello on his back, static with power —
    // and when the end scene finishes, it fades back to the
    // beginning video and the whole loop runs again.
    const titleVideo = document.getElementById('titleVideo');
    const endVideo = document.getElementById('titleEndVideo');
    const powerPulse = document.getElementById('powerPulse');
    let showing = 'title'; // 'title' or 'end'
    function showEnd() {
      if (started || showing === 'end') return;
      showing = 'end';
      endVideo.currentTime = 0;
      endVideo.play();
      endVideo.classList.add('show');
      powerPulse.classList.add('show');
      setTimeout(() => titleVideo.pause(), 1600);
    }
    function showTitle() {
      if (started || showing === 'title') return;
      showing = 'title';
      titleVideo.currentTime = 0;
      titleVideo.play();
      endVideo.classList.remove('show');
      powerPulse.classList.remove('show');
      setTimeout(() => endVideo.pause(), 1600);
    }
    titleVideo.addEventListener('timeupdate', () => {
      if (!titleVideo.duration) return;
      if (titleVideo.currentTime >= titleVideo.duration - 1.5) showEnd();
    });
    endVideo.addEventListener('ended', showTitle);

    // When anywhere on the screen is tapped, fade out the title,
    // show the loading screen for ~5 seconds, then go to
    // character creation
    let started = false;
    function startGame() {
      if (started) return;
      started = true;
      document.body.classList.add('fading');
      const loading = document.getElementById('loading');
      setTimeout(() => loading.classList.add('show'), 1000);
      setTimeout(() => { window.location.href = 'character.html'; }, 6000);
    }
    document.addEventListener('click', startGame);
  </script>
</body>
</html>
