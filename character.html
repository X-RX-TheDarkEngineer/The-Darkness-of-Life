<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Darkness of Life — Character Creation</title>
<style>
  body { margin: 0; background: #05070d; color: #e8ecf4;
    font-family: sans-serif; text-align: center; }
  h1 { margin-top: 40px; color: #00bfff; }
  p { color: #9aa7bd; }
  img.sprite { width: 180px; image-rendering: pixelated; margin-top: 10px; }
  .sprites {
    display: flex; justify-content: center; align-items: flex-end;
    gap: 30px; margin-top: 10px; flex-wrap: wrap;
  }
  .sprites img {
    height: 220px; width: auto; image-rendering: pixelated;
  }
  .weapon-img {
    display: block; width: 100%; max-width: 220px;
    margin: 10px auto; image-rendering: pixelated;
  }
  input {
    margin-top: 10px; padding: 10px; font-size: 20px; text-align: center;
    background: #0d1020; color: #e8ecf4; border: 1px solid #00bfff;
  }
  .choices {
    display: flex; flex-wrap: wrap; gap: 24px;
    justify-content: center; margin: 30px auto;
  }
  .card {
    margin: 0; padding: 20px; width: 260px;
    background: #0d1020; border: 2px solid #00bfff;
    cursor: pointer; position: relative;
  }
  /* The chosen card glows, with a glow below it */
  .card.selected {
    box-shadow: 0 0 25px rgba(0, 191, 255, 0.8),
                0 0 60px rgba(0, 191, 255, 0.4);
  }
  .card.selected::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 5%;
    right: 5%;
    height: 18px;
    margin-top: 6px;
    background: radial-gradient(ellipse at center,
      rgba(0, 191, 255, 0.9), transparent 70%);
    filter: blur(3px);
    pointer-events: none;
  }
  .card h2 { margin: 0; color: #00bfff; }
  .card .value {
    display: inline-block; margin-top: 10px; padding: 4px 12px;
    background: #00bfff; color: #05070d; border-radius: 12px;
  }
  button {
    margin: 10px; padding: 12px 30px; font-size: 18px;
    background: #00bfff; color: #05070d; border: none; cursor: pointer;
  }
  /* Fade the page out when Begin is pressed */
  body > * { transition: opacity 1s ease; }
  body.fading > *:not(#loading) { opacity: 0; }
  /* Loading screen: X-RX runs along the city streets, CoM style */
  #loading {
    position: fixed;
    inset: 0;
    background: url('assets/loading-cityscape.jpg') center bottom / cover no-repeat #05070d;
    z-index: 3;
    opacity: 0;
    pointer-events: none;
  }
  #loading.show { opacity: 1; pointer-events: auto; }
  #loading .runner {
    position: absolute;
    bottom: 18%;
    left: 0;
    width: 100px;
    height: 200px;
    background-image: url('assets/x-rx-run-sheet.png');
    background-size: 600px 200px;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    animation: run-cycle 0.7s steps(6) infinite,
               run-across 5s linear infinite;
  }
  @keyframes run-cycle {
    from { background-position: 0 0; }
    to { background-position: -600px 0; }
  }
  @keyframes run-across {
    from { left: -12%; }
    to { left: 105%; }
  }
  #loading .loading-text {
    position: absolute;
    bottom: 6%;
    left: 50%;
    transform: translateX(-50%);
    color: #00bfff;
    font-size: 22px;
    letter-spacing: 4px;
    margin: 0;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
  }
</style>
</head>
<body>
  <h1>WHO WALKS THE DARK?</h1>
  <div class="sprites">
    <img src="assets/xado-sprite.png" alt="Xado_RemnantX with his sword">
    <img src="assets/x-rx-firing-cello-sprite.png" alt="Xado_RemnantX firing the electric cello">
  </div>
  <p>Your name</p>
  <input id="nameInput" value="Xado_RemnantX">
  <div class="choices">
    <div class="card selected" id="celloCard">
      <h2>CELLO</h2>
      <img class="weapon-img" src="assets/cello-weapon-sprite.png" alt="Electric cello weapon">
      <p>Starting sound — low, warm, bowed. The first card in your deck.</p>
      <span class="value">5</span>
      <br><br>
      <button id="hearBtn">Hear it</button>
    </div>
    <div class="card" id="swordCard">
      <h2>SWORD</h2>
      <img class="weapon-img" src="assets/sword-sprite.png" alt="Sword">
      <p>Starting weapon — huge blade with glowing blue circuitry.</p>
      <span class="value">7</span>
    </div>
  </div>
  <button id="beginBtn">Begin</button>
  <p id="message"></p>

  <!-- Loading screen: X-RX runs along the city streets -->
  <div id="loading">
    <div class="runner"></div>
    <p class="loading-text">Loading...</p>
  </div>
  <script>
    // A cello-like note: sawtooth through a low-pass filter,
    // slow attack like a bow, C2 (65.41 Hz) and its octave.
    function playCello() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 800;
      filter.connect(ctx.destination);
      const gain = ctx.createGain();
      gain.connect(filter);
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.4, now + 0.3); // bow attack
      gain.gain.setValueAtTime(0.4, now + 1.2);
      gain.gain.linearRampToValueAtTime(0, now + 2.0);   // bow lift
      for (const freq of [65.41, 130.81]) {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 2.0);
      }
    }
    document.getElementById('hearBtn').addEventListener('click', playCello);

    // Choose a starting card: cello or sword.
    // The chosen card glows, and the choice carries into the game.
    let startingCard = 'cello';
    const celloCard = document.getElementById('celloCard');
    const swordCard = document.getElementById('swordCard');
    function selectCard(card) {
      startingCard = card;
      celloCard.classList.toggle('selected', card === 'cello');
      swordCard.classList.toggle('selected', card === 'sword');
      localStorage.setItem('tdol-starting-card', card);
    }
    celloCard.addEventListener('click', () => selectCard('cello'));
    swordCard.addEventListener('click', () => selectCard('sword'));
    const savedCard = localStorage.getItem('tdol-starting-card');
    if (savedCard === 'sword') selectCard('sword');

    document.getElementById('beginBtn').addEventListener('click', () => {
      const name = document.getElementById('nameInput').value;
      const item = startingCard === 'cello' ? 'cello in hand' : 'sword in hand';
      document.getElementById('message').textContent =
        name + ' walks the dark, ' + item + '.';
      // Show the message, then fade out, show the loading
      // screen for ~5 seconds, then go to Level 1
      const loading = document.getElementById('loading');
      setTimeout(() => document.body.classList.add('fading'), 1500);
      setTimeout(() => loading.classList.add('show'), 2500);
      setTimeout(() => { window.location.href = 'level1.html'; }, 7500);
    });
  </script>
</body>
</html>
